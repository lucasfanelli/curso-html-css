<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio das Tagas</title>
  </head>
  <body>
    <h1>Tags em HTML</h1>
    <p>
      Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse
      sobre os termos para descobrir qual tag deverá utilizar em cada caso.
    </p>
    <ul type="square">
      <li>
        <abbr title="Utilize a tag &lt;p&gt; para fazer parágrafos"
          >Parágrafos</abbr
        >
      </li>
      <li>
        <abbr title="Utilize a tag &lt;h1&gt; até &lt;h6&gt; para fazer títulos"
          >Títulos</abbr
        >
      </li>
       <li>
        <abbr title="Utilize a tag &lt;img&gt; para fazer imagens"
          >Imagens</abbr
        >
      </li>
      <li>
        <abbr title="Utilize a tag &lt;abbr&gt; para fazer abreviações"
          >Abreviações</abbr
        >
      </li>
      <li>
        <abbr title="Utilize a tag &lt;code&gt; para fazer códigos-fonte"
          >Códigos-fonte</abbr
        >
      </li>
      <li>
        <abbr title="Utilize a tag &lt;ol&gt; para fazer listas numeradas"
          >Listas numeradas</abbr
        >
      </li>
      <li>
        <abbr title="Utilize a tag &lt;ul&gt; para fazer listas com decarcadores"
          >Listas com demarcadores</abbr
        >
      </li>
    </ul>
  </body>
</html>
