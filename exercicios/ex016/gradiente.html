<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        *{/*Configurações globais da CSS*/
            height: 100%;
            background-attachment: fixed;
        }
        body {
            background-image: linear-gradient(to bottom, #A0002B, #CEDFD7, #00693E);
        }
    </style>
</head>
<body>
    <h1>Testanado Gradiente</h1>
</body>
</html>
